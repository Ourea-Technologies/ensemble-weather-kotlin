# SPDX-License-Identifier: BSD-2-Clause
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format, lint, static analysis, spec, docs, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            11
            21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Format (ktlint)
        run: ./gradlew ktlintCheck
      - name: Lint (detekt, with type resolution)
        run: ./gradlew detekt detektMain detektTest
      - name: SpotBugs + Find Security Bugs
        run: ./gradlew spotbugsMain
      - name: Android API 24 compatibility (Animal Sniffer)
        run: ./gradlew animalsnifferMain
      - name: Every runtime dependency is justified in CONTRIBUTING.md
        run: ./gradlew checkDependencies
      - name: spec/ matches spec/VERSION
        run: scripts/sync-spec --check
      - name: Docs (Dokka) and package (jar, sources, javadoc, POM)
        run: ./gradlew dokkaGenerate assemble

  test:
    name: Unit tests and the 43 vectors (JDK ${{ matrix.jdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk: [11, 17, 21, 25]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            11
            ${{ matrix.jdk }}
            21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Tests, vectors and spec drift (coverage on JDK 11)
        env:
          TEST_JDK: ${{ matrix.jdk }}
        run: |
          if [ "$TEST_JDK" = "11" ]; then
            ./gradlew test -PtestJdk="$TEST_JDK" koverXmlReport koverLog
          else
            ./gradlew test -PtestJdk="$TEST_JDK"
          fi
      - name: Upload coverage
        if: matrix.jdk == 11
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: build/reports/kover/report.xml

  examples:
    name: Examples against the local mock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            11
            21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew runExamples
