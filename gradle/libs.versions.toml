# SPDX-License-Identifier: BSD-2-Clause
# Every version the build uses. Runtime dependencies are justified in CONTRIBUTING.md.

[versions]
kotlin = "2.4.21"
coroutines = "1.11.0"
serialization = "1.12.0"
junit = "5.14.4"
snakeyaml = "2.7"  # JUnit 6 needs JDK 17; the library is tested on 11
ktlint = "1.8.0"
ktlintGradle = "14.2.0"
detekt = "2.0.0-alpha.6"
spotbugs = "4.10.5"
spotbugsGradle = "6.5.13"
findsecbugs = "1.14.0"
dokka = "2.2.0"
kover = "0.9.11"
maven-publish = "0.37.0"
animalsniffer = "2.0.1"
androidSignature = "7.0_r2"

[libraries]
# Runtime (the only two: see CONTRIBUTING.md "Runtime dependencies").
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
# Test.
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
# Tooling.
findsecbugs = { module = "com.h3xstream.findsecbugs:findsecbugs-plugin", version.ref = "findsecbugs" }
android-signature = { module = "net.sf.androidscents.signature:android-api-level-24", version.ref = "androidSignature" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugsGradle" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
animalsniffer = { id = "ru.vyarus.animalsniffer", version.ref = "animalsniffer" }
